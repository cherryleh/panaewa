name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'panaewa-app/**'
  workflow_run:
    workflows: ["Run Data Processing"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd panaewa-app
          npm install

      - name: Inject API token into environment.prod.ts
        run: |
          mkdir -p panaewa-app/src/environments
          echo "export const environment = { production: true, apiToken: '$(echo '${{ secrets.API_CONFIG_JSON }}' | base64 -d)' };" > panaewa-app/src/environments/environment.prod.ts

      - name: Generate environment.ts
        run: |
          echo "export const environment = { production: false, apiToken: '' };" > panaewa-app/src/environments/environment.ts

      - name: Build Angular app
        run: |
          cd panaewa-app
          npm run build -- --configuration production

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: panaewa-app/dist/panaewa-app/browser  
